<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<link rel="stylesheet" href="/assets/css/scheme.css" />
		<link rel="stylesheet" href="/ssh/pages/vendor/xterm.min.css" />
		<script src="/ssh/pages/vendor/xterm.min.js"></script>
		<script src="/ssh/pages/vendor/xterm-addon-fit.min.js"></script>
	</head>
	<body class="light bg-base-200 text-base-content" data-sveltekit-preload-data="hover">
		<script>
			try {
				const stored = localStorage.getItem('arupa.theme');
				const theme =
					stored === 'dark' || stored === 'light'
						? stored
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.body.classList.remove('light', 'dark');
				document.body.classList.add(theme);
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch {
				// Keep the default light theme when browser preferences are unavailable.
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
